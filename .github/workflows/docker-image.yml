name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  IMAGE_TAG=${{ vars.IMAGE }}:latest
  IMAGE_PATH="${{ vars.IMAGE }}.tar"
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4  # 检出代码

      # Step 1: 设置 Docker 环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 2: 构建 Docker 镜像
      - name: Build Docker image
        id: build-image
        run: |
          docker build . --file Dockerfile_github --tag $IMAGE_TAG:lasted

      # Step 3: 保存镜像为 tar 文件
      - name: Save Docker image to tar
        id: save-image
        run: |
          docker save -o $IMAGE_PATH $IMAGE_TAG
          echo "image-path=$IMAGE_PATH" >> $GITHUB_ENV  # 将路径设置为环境变量供后续步骤使用

      # Step 4: 上传镜像为 Artifact（可供后续 job 使用）
      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: ${{ env.IMAGE_PATH }}  # 使用环境变量引用镜像路径

  deploy:
    runs-on: ubuntu-22.04
    needs: build  # 确保在 build 完成后再进行 deploy

    steps:
      - uses: actions/checkout@v4  # 检出代码

      # Step 1: 下载并加载镜像
      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i zlatticeDocs_latest.tar  # 加载下载的镜像

      # Step 2: 设置 Docker 环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: 使用 docker-compose 启动容器
      - name: Deploy with Docker Compose
        run: |
          docker-compose -f docker-compose.github.yml up -d
