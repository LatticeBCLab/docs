name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  IMAGE_TAG: lattice_bc_lab:latest
  IMAGE_PATH: "lattice_bc_lab.tar"
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4  # 检出代码

      # Step 1: 设置 Docker 环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 2: 构建 Docker 镜像
      - name: Build Docker image
        id: build-image
        run: |
          docker build . --file Dockerfile_github --tag $IMAGE_TAG
          
      # Step 3: 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: 推送镜像到 Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push $IMAGE_TAG

  deploy:
    runs-on: ubuntu-22.04
    needs: build  # 确保在 build 完成后再进行 deploy

    steps:
      - uses: actions/checkout@v4  # 检出代码

      # Step 1: 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: 拉取 Docker 镜像
      - name: Pull Docker image from Docker Hub
        run: |
          docker pull $IMAGE_TAG

      # Step 2: 设置 Docker 环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: 使用 docker-compose 启动容器
      - name: Deploy with Docker Compose
        run: |
          docker-compose -f docker-compose.github.yml up -d
