name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile_github --tag lattice_bc_lab/zlattice_docs:lasted
  deploy:
    runs-on: ubuntu-22.04
    needs: build  # 确保在 build 工作完成后才执行 deploy

    steps:
    - uses: actions/checkout@v4  # 检出代码

    - name: Deploy with Docker Compose
      run: |
        docker compose -f docker-compose.github.yml up -d  # 使用 docker-compose 部署
