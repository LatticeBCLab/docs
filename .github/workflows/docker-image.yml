name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-22.04

    outputs:
      image-path: ${{ steps.save-image.outputs.image-path }}  # 输出保存的镜像路径，供 deploy 使用

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile_github --tag lattice_bc_lab/zlattice_docs:lasted

      # Step 2: 保存镜像为 tar 文件
    - name: Save Docker image to tar
      id: save-image
      run: |
        IMAGE_TAG=latticeBCLab/zlatticeDocs:latest
        IMAGE_PATH="zlatticeDocs_latest.tar"
        docker save -o $IMAGE_PATH $IMAGE_TAG
        echo "image-path=$IMAGE_PATH" >> $GITHUB_OUTPUT
      outputs:
        image-path: ${{ steps.save-image.outputs.image-path }}  # 输出保存的镜像路径
#
#    - name: Log in to Docker Hub
#      uses: docker/login-action@v2
#      with:
#        username: ${{ secrets.DOCKER_USERNAME }}
#        password: ${{ secrets.DOCKER_PASSWORD }}
#
#    - name: Push image
#      run: |
#        docker push ${{IMAGE_TAG}}:latest
  deploy:
    runs-on: ubuntu-22.04
    needs: build  # 确保在 build 工作完成后才执行 deploy

    steps:
    - uses: actions/checkout@v4  # 检出代码

      # Step 1: 加载镜像
    - name: Load Docker image
      run: |
        IMAGE_PATH="${{ needs.build.outputs.image-path }}"
        docker load -i $IMAGE_PATH

    - name: Deploy with Docker Compose
      run: |
        docker compose -f docker-compose.github.yml up -d  # 使用 docker-compose 部署
